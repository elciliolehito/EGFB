<script>pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
(async()=>{try{const pdf=await pdfjsLib.getDocument('pdfs/introducao-qgis.pdf').promise;const page=await pdf.getPage(1);const c=document.getElementById('cover');if(!c)return;const base=page.getViewport({scale:1});const scale=Math.min(160/base.width,226/base.height)*2;const vp=page.getViewport({scale});c.width=vp.width;c.height=vp.height;await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;}catch(e){}})();</script>
