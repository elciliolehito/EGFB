<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
async function paint(url, canvas) {
  try {
    const pdf = await pdfjsLib.getDocument(url).promise;
    const page = await pdf.getPage(1);
    const parent = canvas.parentElement;
    const maxW = parent.clientWidth || 160, maxH = parent.clientHeight || 226;
    const base = page.getViewport({ scale: 1 });
    const scale = Math.min(maxW / base.width, maxH / base.height) * 2;
    const vp = page.getViewport({ scale });
    canvas.width = vp.width; canvas.height = vp.height;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
  } catch(e) {}
}
paint('livros/arcgis-online-intro.pdf', document.getElementById('cover'));
document.querySelectorAll('canvas[data-pdf]').forEach(c => paint(c.dataset.pdf, c));
</script>
