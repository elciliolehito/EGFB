<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ler · Exercício para o trabalho em grupo 2026</title>
  <link rel="icon" href="../../images/favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body class="bg-[#0b3d44] text-white antialiased">
  <header class="sticky top-0 z-50 bg-[#0b3d44] border-b border-white/10">
    <div class="max-w-[1600px] mx-auto px-3 h-12 flex items-center justify-between gap-2">
      <a href="m4.html" class="text-sm font-semibold text-teal-100">← Ficha</a>
      <span class="text-xs truncate opacity-80">Exercício para o trabalho em grupo 2026</span>
      <a href="../repositorio.html" class="text-xs text-white/60">Repositório</a>
    </div>
  </header>
  <div class="max-w-[1600px] mx-auto grid grid-cols-1 lg:grid-cols-[240px_1fr] min-h-[calc(100vh-3rem)]">
    <aside class="border-b lg:border-b-0 lg:border-r border-white/10 p-4 bg-[#0a3338] space-y-4">
      <div class="w-[160px] h-[226px] mx-auto rounded-md overflow-hidden bg-black/40 flex items-center justify-center"><canvas id="cover" class="max-w-full max-h-full"></canvas></div>
      <div>
        <h1 class="font-bold text-lg">Exercício para o trabalho em grupo 2026</h1>
        <p class="text-xs text-white/50 mt-1">ISPM · 2026</p>
        <p class="text-sm text-white/80 mt-3">Guião de exercício para trabalho em grupo no âmbito do curso.</p>
      </div>
    </aside>
    <div class="bg-black/50 p-2 sm:p-3 min-h-[70vh]"><iframe class="w-full h-full min-h-[70vh] border-0 bg-white" src="pdfs/exercicio-trabalho-grupo.pdf#toolbar=1&view=FitH"></iframe></div>
  </div>
<script>pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
(async()=>{try{const pdf=await pdfjsLib.getDocument('pdfs/exercicio-trabalho-grupo.pdf').promise;const page=await pdf.getPage(1);const c=document.getElementById('cover');if(!c)return;const base=page.getViewport({scale:1});const scale=Math.min(160/base.width,226/base.height)*2;const vp=page.getViewport({scale});c.width=vp.width;c.height=vp.height;await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;}catch(e){}})();</script>
</body>
</html>
