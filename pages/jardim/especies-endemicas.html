  <style>
    body{font-family:Inter,system-ui,sans-serif}
    .dropdown{position:relative}
    .dropdown-menu{display:none;position:absolute;left:0;top:100%;padding-top:8px;z-index:50;min-width:240px}
    .dropdown:hover .dropdown-menu,.dropdown-menu:hover{display:block}
    .dropdown-menu>div{background:#0f3d1e;border-radius:.5rem;box-shadow:0 16px 40px rgba(0,0,0,.25);padding:.5rem 0}

    header{z-index:1000!important}
  
    #mobile-menu {
      max-height: calc(100vh - 4rem);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .species-card { transition: transform 0.25s ease, box-shadow 0.25s ease; }
    .species-card:hover { transform: translateY(-6px); box-shadow: 0 14px 28px rgba(0,0,0,0.12); }
    .species-card img { transition: transform 0.4s ease; }
    .species-card:hover img { transform: scale(1.05); }


.iucn-badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 3.25rem; height: 3.25rem; border-radius: 9999px;
  font-weight: 800; font-size: 0.95rem; letter-spacing: 0.02em;
  color: #fff; flex-shrink: 0; box-shadow: 0 2px 6px rgba(0,0,0,.12);
}
.iucn-badge.sm { width: 2rem; height: 2rem; font-size: 0.65rem; }
.iucn-badge.LC { background: #4caf50; }
.iucn-badge.NT { background: #c6d92d; }
.iucn-badge.VU { background: #f0c808; color: #fff; }
.iucn-badge.EN { background: #f07c2a; }
.iucn-badge.CR { background: #d32f2f; }
.iucn-badge.EW { background: #5c2d5e; }
.iucn-badge.DD { background: #b0b0a8; }
.iucn-badge.NE { background: #fff; color: #111; border: 2px solid #333; }

</style>
